
<style>
  :root{
    --sidebar:#0f3c8a;      
    --sidebar-2:#164b9f;    
    --accent:#2f6fed;       
    --bg:#eee3e3;           
    --card:#28589b;         
    --text:#ffffff;
    --muted:#b7c6e6;
  }
  body{background:var(--bg);}
  .layout{
    display:grid;
    grid-template-columns:260px 1fr;
    min-height:calc(100vh - 48px); /* base.html pone padding 24px */
    gap:24px;
  }
  .sidebar{
    background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));
    border-radius:14px;
    padding:16px 12px;
    color:var(--text);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    position:sticky; top:24px; height:calc(100vh - 48px);
    overflow-y:auto;
  }
  .brand{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
    padding:8px 10px; border-radius:10px;
  }
  .brand .square{width:26px;height:26px;border-radius:6px;background:#2f6fed;display:inline-block}
  .nav{
    margin-top:8px;
  }
  .nav a, .nav button{
    width:100%; display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px; color:var(--text);
    text-decoration:none; border:none; background:transparent;
    cursor:pointer; font-size:15px;
  }
  .nav a:hover, .nav button:hover{ background:rgba(255,255,255,.08); }
  .nav .active{ background:rgba(255,255,255,.14); }
  .nav .chev{ margin-left:auto; transition:transform .2s ease; }
  .submenu{ display:none; padding-left:8px; }
  .submenu a{ font-size:14px; padding:8px 12px; color:#e9f0ff; }
  .submenu.show{ display:block; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:var(--card);
    border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.2); margin-bottom:16px;
  }
  .topbar .welcome{color:var(--text); font-weight:600}
  .topbar .actions a{
    background:var(--accent); color:#fff; padding:8px 12px; border-radius:10px;
    text-decoration:none; font-size:14px;
  }

  .content{
    min-width:0;
  }
  .grid{
    display:grid; grid-template-columns:repeat(12,1fr); gap:16px;
  }
  .card{
    background:var(--card); border-radius:14px; padding:16px; color:var(--text);
    box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  .span-4{grid-column:span 4;}
  .span-6{grid-column:span 6;}
  .span-12{grid-column:span 12;}
  .muted{color:var(--muted); font-size:14px}
  @media (max-width: 980px){
    .layout{grid-template-columns:1fr}
    .sidebar{position:relative; height:auto}
    .span-4,.span-6,.span-12{grid-column:span 12;}
  }
</style>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span class="square"></span>
      <div>
        <div style="font-weight:700">Dashboard</div>
        <div class="muted" style="margin-top:-2px">Arzobispado</div>
      </div>
    </div>

    <nav class="nav">
      <a href="{{ url_for('dashboard') }}" class="active">▢ dashboard</a>

      <!-- Plan Estratégico con submenú -->
      <button type="button" id="btnPlan" aria-expanded="false">
        ☰ Plan Estratégico <span class="chev">▸</span>
      </button>
      <div class="submenu" id="submenuPlan">
        <a href="{{ url_for('plan_liderazgo') }}">› Liderazgo</a>
        <a href="{{ url_for('plan_gestion_pedagogica') }}">› Gestión Pedagógica</a>
        <a href="{{ url_for('plan_convivencia_escolar') }}">› Convivencia Escolar</a>
        <a href="{{ url_for('plan_gestion_recursos') }}">› Gestión de Recursos</a>
      </div>

      <hr style="border-color:rgba(255,255,255,.12); margin:12px 0">

      <a href="{{ url_for('logout') }}">⎋ Cerrar sesión</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="content">
    <div class="topbar">
      <div class="welcome">Bienvenido/a</div>
    
      </div>
    </div>

    

<script>
  // Toggle submenú Plan Estratégico
  const btn = document.getElementById('btnPlan');
  const sub = document.getElementById('submenuPlan');
  const chev = btn.querySelector('.chev');
  btn.addEventListener('click', () => {
    const open = sub.classList.toggle('show');
    btn.setAttribute('aria-expanded', open);
    chev.style.transform = open ? 'rotate(90deg)' : 'rotate(0deg)';
  });
</script>
{% endblock %}
